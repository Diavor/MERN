<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BRÀCE — Pizzeria Napoletana</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      /* ---- Antichi (cream) — DEFAULT, like Pizzeria Grani Antichi ---- */
      --bg: #f1e7d0;
      --bg-2: #e8dab8;
      --bg-3: #ddca9f;
      --line: #cab78b;
      --line-2: #a78f5e;
      --text: #2a1c0a;
      --text-dim: #6a532d;
      --text-faint: #957a4e;
      --accent: #a83920;     /* terracotta brick */
      --gold: #6e4920;       /* warm wheat brown */
      --gold-deep: #4a2f10;
      --cream: #f1e7d0;
      --ok: #5a7a3a;

      /* surface-aware tokens */
      --scrim-blur:        rgba(241,231,208,0.85);
      --scrim-blur-strong: rgba(241,231,208,0.92);
      --scrim-overlay:     rgba(40,28,10,0.35);
      --feature-card:      linear-gradient(135deg, #3a2613 0%, #2a1c0a 100%);
      --grid-line:         rgba(74,47,16,0.08);
      --ph-stripe:         rgba(74,47,16,0.1);
      --ph-bg-1:           #e2d3b0;
      --ph-bg-2:           #cab78b;

      --serif: "Italiana", "Cormorant Garamond", serif;
      --serif-2: "Cormorant Garamond", serif;
      --sans: "DM Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --maxw: 1440px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    /* film grain on the whole page */
    body::before {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.045;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.2  0 0 0 0 0.12  0 0 0 0 0.04  0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    .display { font-family: var(--serif); font-weight: 400; letter-spacing: 0.005em; }
    .mono { font-family: var(--mono); }
    .it { font-family: var(--serif-2); font-style: italic; font-weight: 400; }
    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--line-2); }

    /* selection */
    ::selection { background: var(--accent); color: var(--cream); }

    /* utility */
    .container { max-width: var(--maxw); margin: 0 auto; padding: 0 56px; }
    @media (max-width: 720px) { .container { padding: 0 22px; } }

    .hr {
      height: 1px; background: var(--line); width: 100%;
    }

    /* buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: var(--sans);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 14px 22px;
      border: 1px solid var(--line-2);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      border-radius: 999px;
      transition: all .25s ease;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-1px); }
    .btn.solid { background: var(--text); color: var(--bg); border-color: var(--text); }
    .btn.solid:hover { background: var(--gold); border-color: var(--gold); color: var(--bg); }
    .btn.ember { background: var(--accent); color: var(--cream); border-color: var(--accent); }
    .btn.ember:hover { background: #d04535; border-color: #d04535; color: var(--cream); }
    .btn.ghost { border-color: var(--line); }
    .btn.sm { padding: 8px 14px; font-size: 11px; }
    .btn .arrow { display: inline-block; transition: transform .3s ease; }
    .btn:hover .arrow { transform: translateX(4px); }

    /* placeholder pizza image — used everywhere */
    .pizza-plate {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 28%, rgba(255,220,160,0.18), transparent 38%),
        radial-gradient(circle at 70% 75%, rgba(168,57,32,0.55), transparent 50%),
        radial-gradient(circle at 50% 50%, #c8956a 35%, #8a5a35 80%, #4a2f15 100%);
      box-shadow:
        inset 0 0 60px rgba(40,28,10,0.45),
        inset 0 0 0 1px rgba(110,73,32,0.18);
      overflow: hidden;
    }
    .pizza-plate::after {
      content: "";
      position: absolute; inset: 6%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 22% 28%, #a83920 6px, transparent 9px),
        radial-gradient(circle at 70% 22%, #a83920 5px, transparent 8px),
        radial-gradient(circle at 35% 65%, #a83920 7px, transparent 11px),
        radial-gradient(circle at 75% 70%, #a83920 5px, transparent 8px),
        radial-gradient(circle at 55% 40%, #f0deb0 8px, transparent 12px),
        radial-gradient(circle at 45% 78%, #f0deb0 6px, transparent 10px),
        radial-gradient(circle at 65% 52%, #5a7a3a 4px, transparent 7px),
        radial-gradient(circle at 28% 48%, #5a7a3a 5px, transparent 8px),
        radial-gradient(circle at 50% 50%, #d4a06a 35%, #8a5a35 80%, #5a3a18 100%);
      filter: contrast(1.08) saturate(1.05);
      opacity: 0.92;
    }
    .pizza-plate .crust-glow {
      position: absolute; inset: 0;
      border-radius: 50%;
      box-shadow: inset 0 0 0 8px rgba(120,75,40,0.4), inset 0 0 30px rgba(40,28,10,0.4);
      pointer-events: none;
    }

    /* image placeholder for editorial blocks */
    .ph {
      background:
        repeating-linear-gradient(135deg, var(--ph-stripe) 0 2px, transparent 2px 12px),
        linear-gradient(180deg, var(--ph-bg-1), var(--ph-bg-2));
      display: flex; align-items: center; justify-content: center;
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
    }
    .ph::before {
      content: "";
      position: absolute; inset: 12px;
      border: 1px solid var(--line);
    }

    /* reveal animation */
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes spinSlow { to { transform: rotate(360deg); } }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .rise { animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both; }
    .fade { animation: fade 1.1s ease both; }

    /* keep page from showing FOUC */
    #root:empty::before {
      content: "BRÀCE";
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-size: 64px; letter-spacing: .3em;
      color: var(--accent);
      animation: fade 0.6s ease both;
    }
  </style>

  <script type="application/json" id="speaker-notes">[]</script>
</head>
